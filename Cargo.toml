[package]
name = "patch-ts"
version = "1.5.0"
edition = "2024"
authors = ["Your Name <you@example.com>"]
description = "Tree-sitter-backed patching CLI for AI agents"
license = "MIT"
repository = "https://github.com/elcoosp/patch-ts"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-html = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.6"
tree-sitter-scala = "0.23"
tree-sitter-zig = "1.1"
glob = "0.3"
ratatui = "0.29"
crossterm = "0.28"
notify = "7.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
line-index = "0.1"
strsim = "0.11"
tempfile = "3.24"
anyhow = "1.0"
serde_json = "1.0"
regex = "1.12"
log = "0.4"
env_logger = "0.11"
flickzeug = "0.5"
wasmtime = "35.0"
wit-bindgen = "0.41"
reqwest = { version = "0.13", features = ["blocking", "rustls"] }
git2 = "0.20"
chrono = "0.4"
jsonrepair = { version = "0.1", features = ["serde"] }
tower-lsp = "0.20"
tokio = { version = "1.51", features = ["rt-multi-thread", "io-std", "macros", "fs"] }
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2.1"
cucumber = "0.22"
rstest = "0.26"
proptest = "1.7"
criterion = "0.7"
predicates = "3.1.4"
jsonschema = "0.17"
mockito = "1.4"

[[bench]]
name = "patch_benchmark"
harness = false
