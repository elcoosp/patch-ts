[package]
name = "patch-ts-wasm"
version = "1.14.0"
edition = "2021"
description = "WASM bindings for patch-ts core patching engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[features]
default = ["wasi"]
wasi = []
browser = []
